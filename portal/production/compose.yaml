services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sevlink
      POSTGRES_USER: sevlink
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevlink -d sevlink"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: ../..
      dockerfile: portal/production/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: sevlink
      DB_USER: sevlink
      DEBUG: '0'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/collected-static
    # Only Caddy can reach this port; never publish it directly.
    expose: ['8000']
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PORTAL_HOST: ${PORTAL_HOST:?Set PORTAL_HOST}
      CERT_EMAIL: ${CERT_EMAIL:?Set CERT_EMAIL}
    ports: ['80:80','443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [web]
volumes:
  pgdata:
  static:
  caddydata:
  caddyconfig:
