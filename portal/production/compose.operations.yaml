# Opt-in LOCAL worker example only. Do not use this file to activate real delivery.
# Review with compose.yaml; no service starts until explicitly requested later.
services:
  operations-worker:
    profiles: [operations]
    build:
      context: ../..
      dockerfile: portal/production/Dockerfile
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: sevlink
      DB_USER: sevlink
      DB_SSLMODE: disable # Bundled development DB only; RDS requires verify-full.
      DEBUG: '0'
      SMTP_DELIVERY_ENABLED: '0'
      OPERATIONS_LIVE_DELIVERY_ENABLED: '0'
      OPERATIONS_EMAIL_DELIVERY_BACKEND: portal.mail.PrivatePreviewBackend
    command: [python, manage.py, send_operations_notifications, --watch, --interval, '5']
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - private_previews:/app/private-email-preview
    healthcheck:
      test: [CMD, python, manage.py, operations_mail_status, --fail-if-unhealthy]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3
volumes:
  private_previews:
